// ⭐ POSICIONAMENTO DINÂMICO: acumula nota por estar (ou não) no lugar certo pra fase atual
const OFFSET_ESP={GOL:-260,ZAG:-150,LAT:-70,VOL:-40,MEI:60,ATA:170}; // px à frente da linha média do time, por função
const RIGOR_POS=1.2;  // 'realista forte' — fora de posição pune bastante
function acumularPosicao(dt){
  if(!G||!G.rodando||G.semControle||!G.eu||!G.eu.controlado)return;
  const eu=G.eu, b=G.bola; if(eu.pos==='GOL')return;
  const mates=(eu.time==='A'?G.jogA:G.jogB).filter(j=>j.pos!=='GOL'); if(mates.length<2)return;
  const linha=mates.reduce((a,j)=>a+j.x,0)/mates.length, s=sgn(eu.time);
  const erro=(eu.x-linha)*s-(OFFSET_ESP[eu.pos]||0);  // >0 = mais à frente do que a função pede
  const fase = (b.owner===eu.id)?'bola':(b.team===eu.time?'atk':(b.team?'def':'neu'));
  const m=_ment(eu.time);
  let d=0;
  if(fase==='def'){
    const dDef=clamp(1-Math.abs(b.x-golDefesa(eu.time))/(FW*0.7),0,1);   // bola perto do nosso gol = perigo
    const trans=(G.transDefT>0)?2.0:1.0;                                  // transição defensiva pune o dobro
    if(erro>35){ d=-((erro-35)/200)*(0.35+dDef*1.25)*RIGOR_POS*trans; if(m.recuo<0)d*=0.6; else if(m.recuo>0)d*=1.15; } // ofensivo perdoa (zona-morta 35px)
    else d=+0.05;                                                          // recompôs/ajudou a defender
  } else if(fase==='atk'){
    if(erro<-40){ d=-((Math.abs(erro)-40)/300)*0.55; if(m.sobe>1.2)d*=1.2; } // muito atrás = não oferece (pior se ofensivo)
    else d=+0.045;                                                          // adiantado/oferecendo linha
  } else if(fase==='bola'){ d=+0.05; }
  eu._posDelta=d;
  G.euStats.posQual=(G.euStats.posQual||0)+d*dt;
}
function notaJogador(j, live){
  if(!j||!j.st) return 6.0;
  const st=j.st, pos=NOTA_POS[j.pos]?j.pos:'MEI', w=NOTA_POS[pos];
  const golSofr=(j.time==='A'?G.golsB:G.golsA);
  const shotC = Math.min((st.finAlvo||0)*w.finAlvo + (st.fin||0)*w.fin, 0.45); // chutes não inflam a nota
  const eventos = (st.gols||0)*w.gol + (st.assist||0)*w.assist + shotC
    + (st.pCertos||0)*w.passe + (st.pErrados||0)*w.passeErr
    + (st.desarmes||0)*w.desarme + (st.recup||0)*w.recup + (st.aereos||0)*w.aereo + (st.dribles||0)*w.drible
    + (st.roubadas||0)*w.perda + (st.faltasCom||0)*w.falta + (st.amarelos||0)*w.amarelo
    + (st.defesas||0)*w.defesa + golSofr*w.golSofr - (st.errosGol||0)*0.6;
  const modPos = clamp((st.posQual||0)*0.015, -1.3, 0.7);
  const saldo=(j.time==='A'?G.golsA-G.golsB:G.golsB-G.golsA);
  const ctx = live ? clamp(saldo,-2,2)*0.10 : (saldo>0?w.vit:saldo<0?w.der:0);
  const exp = ((j===G.eu&&G.voceExpulso)||j._expulso) ? -2.5 : 0;
  let total = w.base + eventos + modPos + ctx + exp;
  if(total>8.0) total = 8.0 + (total-8.0)*0.40;   // teto comprimido: nota 10 vira raro (2 gols~9.2, 3 gols~9.8)
  total = clamp(total, 4.0, 10.0);
  if(j===G.eu) G.euStats.notaBreak={base:w.base, eventos:+eventos.toFixed(2), pos:+modPos.toFixed(2), ctx:+(ctx+exp).toFixed(2), total:+total.toFixed(1)};
  return total;
}

  // corpo (gradiente leve)
  const g=ctx.createRadialGradient(j.x-R*0.3,py-R*0.3,1,j.x,py,R);
  g.addColorStop(0,lighten(cor)); g.addColorStop(1,cor);
  ctx.beginPath();ctx.arc(j.x,py,R,0,7);ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle=eu?'#fff':'rgba(0,0,0,.35)';ctx.lineWidth=1.8;ctx.stroke();
  // número
  ctx.fillStyle=corTexto(cor);ctx.font='bold 9px Oswald, Barlow';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(j.num||'',j.x,py);
  if(!eu){ const _n=(j.nome||'').split(' ').pop(); if(_n){ ctx.font='600 7px Barlow, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillText(_n,j.x+0.5,py+R+8.4); ctx.fillStyle='rgba(255,255,255,.82)'; ctx.fillText(_n,j.x,py+R+8); } }
  // dono da bola
  if(G.bola.owner===j.id){ ctx.beginPath();ctx.arc(j.x,py,R+3,0,7);ctx.strokeStyle='rgba(245,200,0,.9)';ctx.lineWidth=2;ctx.stroke(); }
  // pedindo a bola
  if(eu && G.chamando>0){ ctx.fillStyle='#f5c800';ctx.font='bold 13px Oswald';ctx.textAlign='center';ctx.fillText('!',j.x,py-R-9); }
}
function corTexto(hex){ // texto branco ou preto conforme a cor da camisa
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)>150 ? '#111' : 'rgba(255,255,255,.95)';
}
function desenharBola(){
  const b=G.bola; const sp=mag(b.vx,b.vy); const az=(b.alto?(b.az||0):0);
  ctx.beginPath();ctx.ellipse(b.x,b.y+5,Math.max(2,6.5-az*0.04),2,0,0,7);ctx.fillStyle='rgba(0,0,0,'+Math.max(0.08,0.28-az*0.0025)+')';ctx.fill();
  const rb=6.5+az*0.06;
  ctx.save(); ctx.translate(b.x,b.y-az); ctx.rotate(b.spin||0);
  // leve alongamento na direção do movimento
  if(sp>120){ const ang=Math.atan2(b.vy,b.vx); ctx.rotate(ang); ctx.scale(1+Math.min(sp/900,0.5),1); ctx.rotate(-ang+(b.spin||0)); }
  ctx.beginPath();ctx.arc(0,0,rb,0,7);ctx.fillStyle='#fff';ctx.fill();
  ctx.strokeStyle='#222';ctx.lineWidth=1;ctx.stroke();
  // gomos
  ctx.fillStyle='rgba(20,20,20,.9)';
  ctx.beginPath();ctx.arc(0,0,2,0,7);ctx.fill();
  for(let i=0;i<5;i++){ const a=i/5*Math.PI*2; ctx.beginPath();ctx.arc(Math.cos(a)*3.6,Math.sin(a)*3.6,1.1,0,7);ctx.fill(); }
  ctx.restore();
}
function lighten(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${Math.min(255,r+90)},${Math.min(255,g+90)},${Math.min(255,b+90)},1)`;}

function desenharMapaFim(){
  const cv2=document.getElementById('fimMapa'); if(!cv2)return; const c=cv2.getContext('2d'); if(!c)return;
  const W=cv2.width,H=cv2.height; c.clearRect(0,0,W,H);
  c.fillStyle='#1e6830'; c.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){ c.fillStyle=i%2?'rgba(0,0,0,.06)':'rgba(255,255,255,.03)'; c.fillRect(i*W/10,0,W/10,H); }
  // heatmap (sua posição)
  if(G.heat){ const cols=14,rows=9; let mx=1; for(const v of G.heat)if(v>mx)mx=v;
    for(let i=0;i<G.heat.length;i++){ const v=G.heat[i]/mx; if(v<=0)continue; const cx=i%cols, cy=(i/cols)|0;
      c.fillStyle=`rgba(245,200,0,${(0.05+v*0.32).toFixed(3)})`; c.fillRect(cx*W/cols,cy*H/rows,W/cols+0.6,H/rows+0.6); } }
  // linhas do campo
  c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=1; c.strokeRect(3,3,W-6,H-6);
  c.beginPath();c.moveTo(W/2,3);c.lineTo(W/2,H-3);c.stroke();
  c.beginPath();c.arc(W/2,H/2,H*0.12,0,7);c.stroke();
  // chutes
  (G.chutes||[]).forEach(s=>{ const x=clamp(s.x/FW*W,4,W-4), y=clamp(s.y/FH*H,4,H-4);
    const cor=s.team==='A'?G.cfgA.time.cor:G.cfgB.time.cor;
    c.beginPath();
    if(s.gol){ c.arc(x,y,5,0,7); c.fillStyle='#fff'; c.fill(); c.lineWidth=2.2; c.strokeStyle=cor; c.stroke(); }
    else if(s.alvo){ c.arc(x,y,3.4,0,7); c.fillStyle=cor; c.fill(); }
    else { c.arc(x,y,3,0,7); c.lineWidth=1.5; c.strokeStyle=cor; c.stroke(); } });
  c.fillStyle='rgba(255,255,255,.72)';c.font='8px Barlow, sans-serif';c.textAlign='left';c.textBaseline='alphabetic';
  c.fillText('\u25c9 gol  \u25cf no alvo  \u25cb fora  \u00b7  amarelo = seu mapa de calor',5,H-5);
}

  const bt=wrap.querySelector('#_btnEntrar'); if(bt)bt.addEventListener('click',()=>{ wrap.remove(); if(onStart)onStart(); });
}
function iniciarPartidaCarreira(dados, onFim){
  const sa=dados.seu, ad=dados.adv;
  G=criarEstado({time:sa.time, form:sa.form||'4-3-3'}, {time:ad.time, form:ad.form||'4-4-2'}, sa.pos||'ATA', dados.dif||1);
  // injeta SEU jogador real (atributos da carreira)
  if(sa.at){ G.eu.at={...sa.at}; G.eu.ovr = sa.ovr || ovrDe(sa.at, G.eu.pos); }
  if(sa.nome) G.eu.nome = sa.nome;
  G._onFim = onFim || null;
  escudoA.textContent=(sa.time.short||'SEU').slice(0,3); escudoA.style.background=sa.time.cor||'#0F3B2E';
  escudoB.textContent=(ad.time.short||'ADV').slice(0,3); escudoB.style.background=ad.time.cor||'#C8102E';
  nomeA.textContent=sa.time.name||'Seu time'; siglaA.textContent=(sa.form||'4-3-3')+' · você: '+(sa.pos||'ATA');
  nomeB.textContent=ad.time.name||'Adversário'; siglaB.textContent=ad.form||'4-4-2';
  setupPanel.style.display='none';
  if(dados.banco||(dados.seu&&dados.seu.papel==='reserva'))iniciarNoBanco();
  G.cam.x=(G.semControle?G.bola.x:G.eu.x); G.cam.y=(G.semControle?G.bola.y:G.eu.y);
  mostrarEscalacao(()=>{ jogoPanel.style.display='flex'; _emPartida=true; aplicarDeitado(); render(); });
}

    adv:{ time:{name:'Adversário',short:'ADV',cor:'#C8102E',s:75}, form:'4-4-2' },

  }, function(res){

    console.log('FIM (callback p/ carreira):', res);
  });
}
function iniciarSetup(){
  const tA=TEAMS.find(t=>t.id==selTimeA.value), tB=TEAMS.find(t=>t.id==selTimeB.value);
  G=criarEstado({time:tA,form:selFormA.value},{time:tB,form:selFormB.value},selPos.value,selDif.value);

function voltarSetup(){
